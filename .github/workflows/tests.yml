name: tests

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  pytest:
    name: pytest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libxcb-cursor0

      # Numerical libraries are pinned to the versions that generated
      # tests/golden_detection.json. Bump them only together with a
      # deliberate regeneration of the golden file.
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest numpy==2.1.3 scipy==1.15.3 scikit-image==0.25.0 scikit-learn==1.6.1 opencv-python==4.13.0.92 PyQt6==6.7.1

      - name: Run tests
        run: python -m pytest -q

  # The pinned job above guards the golden results; this one installs the
  # newest releases a user gets from `pip install`, on the owner's platform,
  # so API removals (e.g. scikit-image 0.26 dropping num_workers) show up here
  # before they reach users.
  pytest-latest:
    name: pytest (macos-latest, newest dependencies)
    runs-on: macos-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install package with the newest dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade -e . pytest
          python -m pip list | grep -iE "numpy|scipy|scikit|opencv|pyqt"

      - name: Run tests
        run: python -m pytest -q
