[project]
name = "bubbletrack"
version = "3.0.0"
description = "Bubble radius fitting from high-speed camera images"
requires-python = ">=3.10"
dependencies = [
    "PyQt6>=6.5,<6.8",
    "numpy",
    "opencv-python",
    "scikit-image",
    "scikit-learn>=1.3",
    "scipy",
    "matplotlib",
    "pyqtgraph>=0.13",
    "openpyxl>=3.1",
    "fpdf2>=2.7",
]

[project.optional-dependencies]
dev = ["pytest", "pyinstaller", "pip-audit"]

[project.scripts]
bubbletrack = "bubbletrack.app:main"
bubbletrack-cli = "bubbletrack.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
